[project]
name = "naturalql"
version = "0.1.0"
description = "Natural language to guardrailed SQL (Streamlit + DuckDB)"
authors = [{ name = "Paolo Notaro", email = "paolo.notaro@outlook.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.38,<2",
    "pandas>=2.2,<3",
    "sqlglot>=25.9,<30",
    "openai>=1.107,<3",
    "python-dotenv>=1.0,<2",
    "duckdb>=1.1,<2",
]

[tool.poetry]
packages = [{ include = "naturalql", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
ruff = ">=0.9,<1"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "--cov=naturalql --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
